name: Build Android APK (Cloud Compiler)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  build:
    name: Build React PWA and Compile APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # Step 3: Install web dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Compile the React web application
      - name: Build Web App
        run: npm run build

      # Step 5: Set up Java Development Kit (JDK) 17 (Required for modern Android builds)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Step 6: Sync web assets into the Android native platform assets
      - name: Capacitor Sync
        run: npx cap sync

      # Step 7: Build Android Debug APK using Gradle Wrapper
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Step 8: Upload the compiled APK as a downloadable GitHub Action Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Momentum-Habit-Tracker-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
