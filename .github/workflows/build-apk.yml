name: Build Android APK (Cloud Compiler)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build React PWA and Compile APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment (Node 22 is required for Capacitor CLI)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Step 3: Install web dependencies
      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      # Step 4: Compile the React web application
      - name: Build Web App
        run: npm run build

      # Step 4.5: Deploy static web PWA to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      # Step 5: Set up Java Development Kit (JDK) 21 (Required by modern Capacitor Gradle configurations)
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      # Step 6: Check and initialize Android folder if missing (e.g. if gitignored)
      - name: Capacitor Android Sync
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          else
            npx cap sync
          fi

      # Step 6.5: Install ImageMagick utility on the runner
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      # Step 7: Dynamically compile Android launcher icons in the runner from PWA assets
      - name: Generate Android Mipmap Icons
        run: |
          SRC="public/icon-512.png"
          RES_DIR="android/app/src/main/res"
          if [ -f "$SRC" ]; then
            echo "Generating Android launcher mipmap icons..."
            mkdir -p "$RES_DIR/mipmap-mdpi"
            convert "$SRC" -resize 48x48 "$RES_DIR/mipmap-mdpi/ic_launcher.png"
            convert "$SRC" -resize 48x48 "$RES_DIR/mipmap-mdpi/ic_launcher_round.png"
            convert "$SRC" -resize 76x76 -background "#07E56E" -gravity center -extent 108x108 "$RES_DIR/mipmap-mdpi/ic_launcher_foreground.png"

            mkdir -p "$RES_DIR/mipmap-hdpi"
            convert "$SRC" -resize 72x72 "$RES_DIR/mipmap-hdpi/ic_launcher.png"
            convert "$SRC" -resize 72x72 "$RES_DIR/mipmap-hdpi/ic_launcher_round.png"
            convert "$SRC" -resize 114x114 -background "#07E56E" -gravity center -extent 162x162 "$RES_DIR/mipmap-hdpi/ic_launcher_foreground.png"

            mkdir -p "$RES_DIR/mipmap-xhdpi"
            convert "$SRC" -resize 96x96 "$RES_DIR/mipmap-xhdpi/ic_launcher.png"
            convert "$SRC" -resize 96x96 "$RES_DIR/mipmap-xhdpi/ic_launcher_round.png"
            convert "$SRC" -resize 152x152 -background "#07E56E" -gravity center -extent 216x216 "$RES_DIR/mipmap-xhdpi/ic_launcher_foreground.png"

            mkdir -p "$RES_DIR/mipmap-xxhdpi"
            convert "$SRC" -resize 144x144 "$RES_DIR/mipmap-xxhdpi/ic_launcher.png"
            convert "$SRC" -resize 144x144 "$RES_DIR/mipmap-xxhdpi/ic_launcher_round.png"
            convert "$SRC" -resize 228x228 -background "#07E56E" -gravity center -extent 324x324 "$RES_DIR/mipmap-xxhdpi/ic_launcher_foreground.png"

            mkdir -p "$RES_DIR/mipmap-xxxhdpi"
            convert "$SRC" -resize 192x192 "$RES_DIR/mipmap-xxxhdpi/ic_launcher.png"
            convert "$SRC" -resize 192x192 "$RES_DIR/mipmap-xxxhdpi/ic_launcher_round.png"
            convert "$SRC" -resize 304x304 -background "#07E56E" -gravity center -extent 432x432 "$RES_DIR/mipmap-xxxhdpi/ic_launcher_foreground.png"
            
            echo "Android mipmap icons completed!"
          else
            echo "Warning: Source icon-512.png not found."
          fi

      # Step 8: Build Android Debug APK using Gradle Wrapper
      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      # Step 8.5: Rename APK to Momentum.apk
      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk \
             android/app/build/outputs/apk/debug/Momentum.apk

      # Step 9: Upload the compiled APK as a downloadable GitHub Action Artifact
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Momentum-APK
          path: android/app/build/outputs/apk/debug/Momentum.apk
          retention-days: 7